name: Build vdexExtractor

# 创建 Release 需要写权限（新仓库默认只读，会失败）
permissions:
  contents: write

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch: 

jobs:
  build-native:
    name: Build (gcc)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies (zlib)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libz-dev

      - name: Build (gcc)
        run: |
          mkdir -p bin         
          chmod +x make.sh
          ./make.sh gcc

      - name: Smoke test (version / help)
        run: |
          ls -la bin/
          ./bin/vdexExtractor -h || true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vdexExtractor-gcc-linux-x86_64
          path: |
            bin/*
          if-no-files-found: error

  # 打 v* tag 时，把二进制发布到 Releases（永久链接、不会过期）
  release:
    name: Release
    needs: build-native
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: vdexExtractor-gcc-linux-x86_64
          path: bin

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          chmod +x bin/vdexExtractor
          ./bin/vdexExtractor -h || true
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "vdexExtractor $TAG" \
            --generate-notes \
            bin/vdexExtractor
