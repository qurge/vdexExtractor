name: Build vdexExtractor

# 发布 Release 需要写权限（新仓库默认只读，会失败）
permissions:
  contents: write

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:        # 允许手动触发

jobs:
  # 宿主平台（Linux）原生构建：gcc
  build-native:
    name: Build (gcc)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies (zlib)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libz-dev

      - name: Build (gcc)
        run: |
          mkdir -p bin            # src/Makefile 会把产物 cp 到 ../bin，确保目录存在
          chmod +x make.sh
          ./make.sh gcc

      - name: Smoke test (version / help)
        run: |
          ls -la bin/
          ./bin/vdexExtractor -h || true

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: vdexExtractor-gcc-linux-x86_64
          path: |
            bin/*
          if-no-files-found: error
