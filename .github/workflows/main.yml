name: Build vdexExtractor

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch: 

jobs:
  build-native:
    name: Build (gcc)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies (zlib)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libz-dev

      - name: Build (gcc)
        run: |
          mkdir -p bin         
          chmod +x make.sh
          ./make.sh gcc

      - name: Smoke test (version / help)
        run: |
          ls -la bin/
          ./bin/vdexExtractor -h || true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vdexExtractor-gcc-linux-x86_64
          path: |
            bin/*
          if-no-files-found: error
